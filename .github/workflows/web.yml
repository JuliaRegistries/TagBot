name: Web Service Check
on:
  push:
    branches: [master]
    paths:
      - 'tagbot/web/**'
      - 'template.yaml'
      - 'samconfig.toml'
      - 'pyproject.toml'
      - 'poetry.lock'
      - 'Makefile'
      - '.github/workflows/web.yml'
  pull_request:
    paths:
      - 'tagbot/web/**'
      - 'template.yaml'
      - 'samconfig.toml'
      - 'pyproject.toml'
      - 'poetry.lock'
      - 'Makefile'
      - '.github/workflows/web.yml'
jobs:
  check:
    runs-on: ubuntu-slim
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: actions/setup-python@6d4fd22b20465ccc0f7354476588e8df7c9ca0e0 # v7.1.0
        with:
          python-version: '3.12'
      - run: pip install poetry poetry-plugin-export
      - uses: aws-actions/setup-sam@341eee193f458fa5aae5d52c94b0c5cf3a1c5a52 # v2
      - run: sam validate --lint
      - run: sam build
